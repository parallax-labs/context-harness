# Context Harness Documentation Site — Zola Configuration
# https://www.getzola.org/documentation/getting-started/configuration/

base_url = "https://parallax-labs.github.io/context-harness"
title = "Context Harness"
description = "Run project agents with relevant context, scoped tools, and inspectable history. Keep your index local and use the model you configure."
compile_sass = true
minify_html = false
build_search_index = false          # We use ctx-search.js instead
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]
highlight_code = true
highlight_theme = "base16-ocean-dark"
smart_punctuation = true

[extra]
github_url = "https://github.com/parallax-labs/context-harness"
tagline = "Project context for inspectable agents"
author = "Parallax Labs"
og_image = "og-image.jpg"
twitter_handle = "@parallaboratory"

[[taxonomies]]
name = "tags"

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["http://localhost"]
